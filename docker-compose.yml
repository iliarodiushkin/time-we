version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: timewe_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timewe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: timewe_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build: ./app
    container_name: timewe_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/timewe
      SECRET_KEY: dev-secret-key-change-in-prod
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app        # hot reload — правки сразу применяются
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
